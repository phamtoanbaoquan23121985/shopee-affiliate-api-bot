name: DUAL-X tests
on:
  push:
    branches: [feature/dual-x-commerce-v1]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile new modules
        run: python -m compileall -q dual_x
